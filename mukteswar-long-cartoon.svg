<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 720" width="100%" height="100%" class="mukteswar-character-svg">
  <defs>
    <!-- Soft Red/Crimson Ambient Glow Filter -->
    <filter id="crimsonAura" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="characterGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ff2a51" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#e11d48" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="skinGrad" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e8a87c"/>
      <stop offset="65%" stop-color="#d38e5f"/>
      <stop offset="100%" stop-color="#b87346"/>
    </radialGradient>

    <linearGradient id="neckGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#995831"/>
      <stop offset="100%" stop-color="#c98254"/>
    </linearGradient>

    <linearGradient id="hairDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#242426"/>
      <stop offset="60%" stop-color="#121315"/>
      <stop offset="100%" stop-color="#080809"/>
    </linearGradient>

    <linearGradient id="blackSilkShirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22252a"/>
      <stop offset="25%" stop-color="#14161a"/>
      <stop offset="70%" stop-color="#090a0d"/>
      <stop offset="100%" stop-color="#040507"/>
    </linearGradient>

    <linearGradient id="collarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d323b"/>
      <stop offset="100%" stop-color="#16181d"/>
    </linearGradient>

    <linearGradient id="silverChain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <style>
    .character-body-group {
      transform-origin: 230px 480px;
      animation: characterFloat 4s ease-in-out infinite alternate;
    }
    .eyes-blink-group {
      transform-origin: 230px 220px;
      animation: eyeBlink 5.5s infinite;
    }
    .crimson-ambient-glow {
      animation: glowPulse 3.5s ease-in-out infinite alternate;
    }

    @keyframes characterFloat {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }
    @keyframes eyeBlink {
      0%, 96%, 100% { transform: scaleY(1); }
      98% { transform: scaleY(0.12); }
    }
    @keyframes glowPulse {
      0% { opacity: 0.6; transform: scale(0.96); }
      100% { opacity: 1; transform: scale(1.04); }
    }
  </style>

  <!-- Ambient Soft Red Glow Behind the Long Silhouette (No Box, Just Warm Light) -->
  <ellipse cx="230" cy="360" rx="190" ry="290" fill="url(#characterGlow)" class="crimson-ambient-glow"/>

  <!-- Character Group with Floating Physics -->
  <g class="character-body-group">

    <!-- 1. Torso & Black Silk Button-Down Shirt (Long individual body) -->
    <!-- Shoulders and Torso -->
    <path d="M 75 720 L 85 540 Q 105 400 170 380 L 230 435 L 290 380 Q 355 400 375 540 L 385 720 Z" fill="url(#blackSilkShirt)"/>

    <!-- Silk Sheen Highlights & Sleeve Contours -->
    <path d="M 85 540 Q 120 440 170 395" fill="none" stroke="#333842" stroke-width="3" opacity="0.6"/>
    <path d="M 375 540 Q 340 440 290 395" fill="none" stroke="#333842" stroke-width="3" opacity="0.6"/>
    
    <!-- Chest / Center Placket -->
    <path d="M 227 450 L 227 720 L 233 720 L 233 450 Z" fill="#1b1d22"/>
    <circle cx="230" cy="495" r="3" fill="#475569"/>
    <circle cx="230" cy="555" r="3" fill="#475569"/>
    <circle cx="230" cy="615" r="3" fill="#475569"/>
    <circle cx="230" cy="675" r="3" fill="#475569"/>

    <!-- Left Open Collar -->
    <path d="M 170 380 L 230 460 L 202 468 L 138 402 Z" fill="url(#collarGrad)"/>
    <!-- Right Open Collar -->
    <path d="M 290 380 L 230 460 L 258 468 L 322 402 Z" fill="url(#collarGrad)"/>

    <!-- 2. Neck & Open V-Collar Chest Area -->
    <path d="M 188 285 L 188 385 L 272 385 L 272 285 Z" fill="url(#neckGrad)"/>
    <path d="M 195 305 L 195 395 L 265 395 L 265 305 Z" fill="#c98254"/>

    <!-- Thin Silver Chain Necklace -->
    <path d="M 200 345 Q 230 388 260 345" fill="none" stroke="url(#silverChain)" stroke-width="2.8" stroke-linecap="round"/>

    <!-- 3. Ears -->
    <path d="M 134 220 Q 120 236 134 262 Q 143 266 148 244 Z" fill="#c47d51"/>
    <path d="M 136 230 Q 130 240 136 250" fill="none" stroke="#995831" stroke-width="2"/>

    <path d="M 326 220 Q 340 236 326 262 Q 317 266 312 244 Z" fill="#c47d51"/>
    <path d="M 324 230 Q 330 240 324 250" fill="none" stroke="#995831" stroke-width="2"/>

    <!-- 4. Face Contour (Matching Mukteswar's distinct facial structure) -->
    <path d="M 144 175 Q 138 255 166 295 Q 200 330 230 332 Q 260 330 294 295 Q 322 255 316 175 Q 300 115 230 115 Q 160 115 144 175 Z" fill="url(#skinGrad)"/>

    <!-- Soft Cheek Tone -->
    <ellipse cx="172" cy="260" rx="16" ry="8" fill="#d97746" opacity="0.35"/>
    <ellipse cx="288" cy="260" rx="16" ry="8" fill="#d97746" opacity="0.35"/>

    <!-- 5. Nose -->
    <path d="M 226 210 Q 230 245 222 252 Q 230 256 238 252 Q 232 238 234 210" fill="#ba6a3d" opacity="0.6"/>
    <ellipse cx="230" cy="252" rx="6.5" ry="3.5" fill="#a4562c" opacity="0.5"/>

    <!-- 6. Expressive Eyes with Blink Animation -->
    <g class="eyes-blink-group">
      <!-- Left Eye -->
      <path d="M 172 220 Q 190 207 208 220 Q 190 231 172 220 Z" fill="#ffffff"/>
      <ellipse cx="190" cy="219" rx="7.5" ry="7.5" fill="#2d1a10"/>
      <circle cx="190" cy="219" r="4.2" fill="#0f0906"/>
      <circle cx="192.5" cy="217" r="2" fill="#ffffff"/>

      <!-- Right Eye -->
      <path d="M 252 220 Q 270 207 288 220 Q 270 231 252 220 Z" fill="#ffffff"/>
      <ellipse cx="270" cy="219" rx="7.5" ry="7.5" fill="#2d1a10"/>
      <circle cx="270" cy="219" r="4.2" fill="#0f0906"/>
      <circle cx="272.5" cy="217" r="2" fill="#ffffff"/>
    </g>

    <!-- Eyebrows (Neat, groomed, dark) -->
    <path d="M 166 206 Q 188 194 212 205" fill="none" stroke="#161719" stroke-width="5" stroke-linecap="round"/>
    <path d="M 248 205 Q 272 194 294 206" fill="none" stroke="#161719" stroke-width="5" stroke-linecap="round"/>

    <!-- Friendly Smile -->
    <path d="M 204 278 Q 230 302 256 278" fill="none" stroke="#873e1c" stroke-width="3.8" stroke-linecap="round"/>
    <path d="M 212 281 Q 230 293 248 281" fill="#ffffff" opacity="0.95"/>

    <!-- Subtle Stubble & Mustache Details -->
    <path d="M 214 269 Q 230 267 246 269" fill="none" stroke="#33241b" stroke-width="2.2" stroke-linecap="round" opacity="0.5"/>
    <path d="M 215 312 Q 230 322 245 312" fill="none" stroke="#33241b" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
    <path d="M 178 290 Q 200 320 222 325" fill="none" stroke="#33241b" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
    <path d="M 282 290 Q 260 320 238 325" fill="none" stroke="#33241b" stroke-width="2" stroke-linecap="round" opacity="0.35"/>

    <!-- 7. Styled Modern Hair (Short fade on sides, textured wavy top) -->
    <path d="M 138 180 Q 130 115 190 92 Q 242 78 280 96 Q 330 118 322 180 Q 316 162 305 152 Q 270 142 230 150 Q 192 142 155 154 Q 144 164 138 180 Z" fill="url(#hairDark)"/>
    <!-- Top Hair Texture Waves -->
    <path d="M 150 145 Q 178 112 215 124 Q 250 108 290 128 Q 312 140 315 162 Q 290 130 252 136 Q 210 124 172 140 Z" fill="#2c2f36"/>
    <path d="M 195 115 Q 222 92 260 102 Q 240 112 218 110 Z" fill="#444a54" opacity="0.6"/>
    <!-- Hairline fringe edge -->
    <path d="M 148 168 Q 162 150 184 154 Q 206 148 228 156 Q 254 148 280 156 Q 302 150 314 168 Q 300 160 274 162 Q 242 156 216 162 Q 184 156 148 168 Z" fill="#121315"/>

  </g>
</svg>
