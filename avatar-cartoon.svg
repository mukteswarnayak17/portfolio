<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" class="animated-cartoon-avatar">
  <defs>
    <!-- Background Glow Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#060913" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="skinBase" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#e8a87c"/>
      <stop offset="65%" stop-color="#d38e5f"/>
      <stop offset="100%" stop-color="#b87346"/>
    </radialGradient>

    <linearGradient id="neckShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#995831"/>
      <stop offset="100%" stop-color="#c98254"/>
    </linearGradient>

    <linearGradient id="hairGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#242426"/>
      <stop offset="50%" stop-color="#121315"/>
      <stop offset="100%" stop-color="#080809"/>
    </linearGradient>

    <linearGradient id="shirtGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e2229"/>
      <stop offset="35%" stop-color="#0f1115"/>
      <stop offset="100%" stop-color="#08090b"/>
    </linearGradient>

    <linearGradient id="shirtCollar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d333d"/>
      <stop offset="100%" stop-color="#14171c"/>
    </linearGradient>

    <linearGradient id="silverChain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="cyberRingGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Filter for Glow -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .cyber-ring-outer {
      transform-origin: 250px 250px;
      animation: rotateRing 20s linear infinite;
    }
    .cyber-ring-inner {
      transform-origin: 250px 250px;
      animation: rotateRingRev 14s linear infinite;
    }
    .pulse-core {
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }
    .eye-pupil {
      transform-origin: 250px 230px;
      animation: eyeBlink 5s infinite;
    }
    .floating-character {
      transform-origin: 250px 300px;
      animation: avatarFloat 4.5s ease-in-out infinite alternate;
    }
    .data-particle-1 { animation: floatP1 6s ease-in-out infinite; }
    .data-particle-2 { animation: floatP2 8s ease-in-out infinite; }

    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes rotateRingRev {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.6; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1.02); }
    }
    @keyframes avatarFloat {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    @keyframes eyeBlink {
      0%, 96%, 100% { transform: scaleY(1); }
      98% { transform: scaleY(0.1); }
    }
    @keyframes floatP1 {
      0% { transform: translate(0, 0); opacity: 0.3; }
      50% { transform: translate(10px, -15px); opacity: 0.9; }
      100% { transform: translate(0, 0); opacity: 0.3; }
    }
    @keyframes floatP2 {
      0% { transform: translate(0, 0); opacity: 0.4; }
      50% { transform: translate(-12px, -20px); opacity: 0.95; }
      100% { transform: translate(0, 0); opacity: 0.4; }
    }
  </style>

  <!-- Ambient Backdrop -->
  <circle cx="250" cy="250" r="230" fill="#0b1324"/>
  <circle cx="250" cy="250" r="210" fill="url(#bgGlow)" class="pulse-core"/>

  <!-- Rotating Holographic Cybernetic Orbit Rings -->
  <g class="cyber-ring-outer">
    <circle cx="250" cy="250" r="218" fill="none" stroke="url(#cyberRingGrad)" stroke-width="2" stroke-dasharray="14 18 36 12" opacity="0.6"/>
    <circle cx="250" cy="32" r="4" fill="#00f2fe" filter="url(#cyanGlow)"/>
    <circle cx="468" cy="250" r="3.5" fill="#38bdf8"/>
    <circle cx="250" cy="468" r="4.5" fill="#6366f1"/>
  </g>
  <g class="cyber-ring-inner">
    <circle cx="250" cy="250" r="198" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 24 16 8" opacity="0.4"/>
  </g>

  <!-- Floating Character Group -->
  <g class="floating-character">

    <!-- Neck & Chest Underlay -->
    <path d="M 215 285 L 215 365 L 285 365 L 285 285 Z" fill="url(#neckShadow)"/>
    <path d="M 220 300 L 220 375 L 280 375 L 280 300 Z" fill="#c98254"/>

    <!-- Subtle Silver Chain Necklace -->
    <path d="M 224 330 Q 250 364 276 330" fill="none" stroke="url(#silverChain)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Black Silk Collared Shirt -->
    <path d="M 125 500 L 140 430 Q 155 375 205 365 L 250 410 L 295 365 Q 345 375 360 430 L 375 500 Z" fill="url(#shirtGrad)"/>
    <!-- Left Collar Wing -->
    <path d="M 205 365 L 250 430 L 228 438 L 175 385 Z" fill="url(#shirtCollar)"/>
    <!-- Right Collar Wing -->
    <path d="M 295 365 L 250 430 L 272 438 L 325 385 Z" fill="url(#shirtCollar)"/>
    <!-- Shirt Placket & Fold Highlights -->
    <path d="M 248 430 L 248 500 L 252 500 L 252 430 Z" fill="#2d333d"/>
    <circle cx="250" cy="460" r="2.5" fill="#475569"/>
    <circle cx="250" cy="488" r="2.5" fill="#475569"/>

    <!-- Ears -->
    <path d="M 162 230 Q 150 245 162 268 Q 170 272 174 250 Z" fill="#c47d51"/>
    <path d="M 164 240 Q 158 248 164 258" fill="none" stroke="#995831" stroke-width="2"/>

    <path d="M 338 230 Q 350 245 338 268 Q 330 272 326 250 Z" fill="#c47d51"/>
    <path d="M 336 240 Q 342 248 336 258" fill="none" stroke="#995831" stroke-width="2"/>

    <!-- Head / Face Shape -->
    <!-- Mukteswar's distinct facial contour: defined jawline, gentle rounded chin -->
    <path d="M 170 190 Q 165 260 190 295 Q 220 325 250 326 Q 280 325 310 295 Q 335 260 330 190 Q 315 135 250 135 Q 185 135 170 190 Z" fill="url(#skinBase)"/>

    <!-- Soft Cheek Shading -->
    <ellipse cx="195" cy="265" rx="14" ry="7" fill="#d97746" opacity="0.3"/>
    <ellipse cx="305" cy="265" rx="14" ry="7" fill="#d97746" opacity="0.3"/>

    <!-- Nose -->
    <path d="M 246 220 Q 250 252 243 258 Q 250 262 257 258 Q 252 245 254 220" fill="#ba6a3d" opacity="0.6"/>
    <ellipse cx="250" cy="258" rx="6" ry="3" fill="#a4562c" opacity="0.5"/>

    <!-- Eyes Group with Blinking Animation -->
    <g class="eye-pupil">
      <!-- Left Eye -->
      <path d="M 195 228 Q 212 216 228 228 Q 212 238 195 228 Z" fill="#ffffff"/>
      <ellipse cx="212" cy="227" rx="6.5" ry="6.5" fill="#2d1a10"/>
      <circle cx="212" cy="227" r="3.5" fill="#0f0906"/>
      <circle cx="214" cy="225" r="1.8" fill="#ffffff"/>

      <!-- Right Eye -->
      <path d="M 272 228 Q 288 216 305 228 Q 288 238 272 228 Z" fill="#ffffff"/>
      <ellipse cx="288" cy="227" rx="6.5" ry="6.5" fill="#2d1a10"/>
      <circle cx="288" cy="227" r="3.5" fill="#0f0906"/>
      <circle cx="290" cy="225" r="1.8" fill="#ffffff"/>
    </g>

    <!-- Eyebrows (Neat, masculine, defined) -->
    <path d="M 190 216 Q 210 205 232 215" fill="none" stroke="#161719" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 268 215 Q 290 205 310 216" fill="none" stroke="#161719" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Friendly Smile -->
    <path d="M 226 280 Q 250 300 274 280" fill="none" stroke="#873e1c" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 233 283 Q 250 293 267 283" fill="#ffffff" opacity="0.9"/>

    <!-- Stylized Facial Hair: subtle mustache & chin stubble -->
    <path d="M 235 272 Q 250 270 265 272" fill="none" stroke="#33241b" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <path d="M 236 308 Q 250 318 264 308" fill="none" stroke="#33241b" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
    <path d="M 200 290 Q 220 316 242 320" fill="none" stroke="#33241b" stroke-width="1.8" stroke-linecap="round" opacity="0.35"/>
    <path d="M 300 290 Q 280 316 258 320" fill="none" stroke="#33241b" stroke-width="1.8" stroke-linecap="round" opacity="0.35"/>

    <!-- Hair: Modern layered cut, cropped sides, wavy texture on top -->
    <!-- Base volume -->
    <path d="M 164 195 Q 155 140 210 115 Q 260 100 295 118 Q 345 140 336 195 Q 330 180 320 170 Q 285 160 250 168 Q 215 160 180 170 Q 170 180 164 195 Z" fill="url(#hairGrad)"/>
    <!-- Top Hair Waves & Texture Tufts -->
    <path d="M 175 165 Q 200 135 235 145 Q 265 130 305 148 Q 325 160 328 180 Q 305 150 270 155 Q 230 145 195 160 Z" fill="#2d3036"/>
    <path d="M 215 135 Q 240 115 275 125 Q 255 135 235 132 Z" fill="#3f454e" opacity="0.6"/>
    <!-- Forehead hair fringe edge -->
    <path d="M 172 185 Q 185 170 205 174 Q 225 168 245 175 Q 270 168 295 175 Q 315 170 328 185 Q 315 178 290 180 Q 260 174 235 180 Q 205 174 172 185 Z" fill="#121315"/>

  </g>

  <!-- Ambient Floating Data Particles -->
  <g class="data-particle-1">
    <circle cx="95" cy="180" r="3" fill="#00f2fe" opacity="0.8"/>
    <circle cx="110" cy="195" r="1.5" fill="#38bdf8" opacity="0.5"/>
  </g>
  <g class="data-particle-2">
    <circle cx="405" cy="220" r="3.5" fill="#10b981" opacity="0.75"/>
    <circle cx="390" cy="240" r="2" fill="#34d399" opacity="0.5"/>
  </g>
</svg>
